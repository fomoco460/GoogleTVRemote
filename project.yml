name: GoogleTVRemote
options:
  bundleIdPrefix: local.fomoco460
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
targets:
  GoogleTVRemote:
    type: application
    platform: iOS
    sources:
      - RemoteApp.swift
      - TVConnection.swift
      - BluetoothBackup.swift
      - Identity.swift
      - Wire.swift
      - Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: My TV Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Find and control your Chromecast on your Wi-Fi network.
        NSBonjourServices: ['_androidtvremote2._tcp']
        NSBluetoothAlwaysUsageDescription: Provide experimental Bluetooth remote buttons for your Chromecast when Wi-Fi is unavailable.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fomoco460.GoogleTVRemote
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RemoteWidget
  RemoteWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: Generated/WidgetInfo.plist
      properties:
        CFBundleDisplayName: My TV Remote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fomoco460.GoogleTVRemote.Widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  RemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GoogleTVRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GoogleTVRemote:
    build:
      targets:
        GoogleTVRemote: all
        RemoteTests: [test]
    test:
      targets: [RemoteTests]
