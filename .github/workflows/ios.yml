name: Build iPhone app
on: [push, workflow_dispatch]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Build the IPA first so a slow or hanging simulator test can never block it.
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project GoogleTVRemote.xcodeproj -scheme GoogleTVRemote -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E 'error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)' || true
          test -d build/Build/Products/Release-iphoneos/GoogleTVRemote.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GoogleTVRemote.app Payload/
          zip -qr MyTVRemote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MyTVRemote-unsigned
          path: MyTVRemote-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildLog
          path: build.log
          if-no-files-found: ignore
      # Tests are informational only; they don't gate the IPA.
      - name: Test protocol framing and identity
        continue-on-error: true
        timeout-minutes: 12
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -project GoogleTVRemote.xcodeproj -scheme GoogleTVRemote -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
