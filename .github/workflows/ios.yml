name: Build iPhone app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test protocol framing and identity
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test -project GoogleTVRemote.xcodeproj -scheme GoogleTVRemote -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project GoogleTVRemote.xcodeproj -scheme GoogleTVRemote -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GoogleTVRemote.app Payload/
          zip -qr MyTVRemote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MyTVRemote-unsigned
          path: MyTVRemote-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
